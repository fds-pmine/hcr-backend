[package]
name = "hcr"
description = "HCR backend service core: catalog, authoritative replay, adaptive sessions."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[dependencies]
hcr_contract = { workspace = true, features = ["std"] }
hcr_sim = { workspace = true, features = ["std", "planner"] }
hcr_qbank = { version = "0.3.1", path = "../hcr_qbank" }
arona = { version = "0.0.1" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# HMAC-SHA256 for itemRef tokens. Unlike the WebSocket handshake's SHA-1, this
# one IS a security primitive: it is what stops a client forging an item binding.
hmac = "0.12"
sha2 = { workspace = true, features = ["std"] }
base64 = { version = "0.22", features = ["std"] }

# Optional: the hotaru HTTP adapter. Off by default so the service core stays
# independent of the framework — and of churn in it.
# `default-features = false` drops the `cli` binary and the akari template
# engine, neither of which a service needs. This crate is std-only anyway — it
# depends on arona and tokio — so the embedded constraints never applied here.
hotaru = { version = "0.8.6", default-features = false, features = [
    "http",
    "tokio",
    "trans",
], optional = true }
hotaru_http = { version = "0.8.6", optional = true }
hotaru_core = { version = "0.8.6", optional = true }

[features]
default = []
hotaru = ["dep:hotaru", "dep:hotaru_http", "dep:hotaru_core"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "serve"
required-features = ["hotaru"]

# The deployable server. Needs the framework adapter, so it is feature-gated
# exactly like the example — the library core stays transport-free either way.
[[bin]]
name = "hcr-server"
path = "src/bin/hcr-server.rs"
required-features = ["hotaru"]

[lints.rust]
missing_docs = "warn"
