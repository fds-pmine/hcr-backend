# nginx reverse proxy for hcr-server, written for aaPanel.
#
# In aaPanel: create the site api.hcr.rs, then Site → Config File and
# replace the generated `location /` with what is below. Keep the panel's own
# SSL block — it manages the certificate and its renewal.
#
# Two prerequisites live outside this file, both in the `http {}` context
# (aaPanel: App Store → Nginx → Settings → Configuration):
#
#   1. The rate-limit zones. `map` and `limit_req_zone` are only valid in
#      `http {}`. docs/DEPLOY.md §2.1 has the same lines plus the include:
#
#        # IPv4: the address. IPv6: the /64 (first 8 bytes).
#        # shortcut: a routed /48 still gets 65k buckets; move to a Cloudflare rate-limiting rule if the access log shows it.
#        map $binary_remote_addr $hcr_client { "~(?s)^(?<hcr_v6net>.{8}).{8}$" $hcr_v6net; default $binary_remote_addr; }
#        map $request_method $hcr_read  { GET $hcr_client; OPTIONS $hcr_client; default ""; }
#        map $request_method $hcr_write { GET ""; OPTIONS ""; default $hcr_client; }
#        limit_req_zone $hcr_read  zone=hcrpoll:10m rate=30r/s;
#        limit_req_zone $hcr_write zone=hcrapi:10m  rate=4r/s;
#
#   2. Cloudflare's real-IP ranges, so the limit keys on the visitor rather
#      than on Cloudflare. Generate with deploy/cloudflare-realip.sh (the
#      install sequence is in docs/DEPLOY.md §2.1) and include the result:
#
#        include /www/server/nginx/conf/cloudflare-realip.conf;
#
# Without (2) every request appears to come from a handful of Cloudflare
# addresses, so the rate limit throttles all of your users as one and the access
# log records nothing useful. It is the single most common way this setup is got
# wrong.
#
# `real_ip_header` needs the realip module, which is compiled in rather than
# loadable. Check before relying on it — nginx fails to start on an unknown
# directive, so getting this wrong takes the site down rather than degrading it:
#
#     nginx -V 2>&1 | tr ' ' '\n' | grep realip
#
# If it is absent, drop the `include` and the `limit_req` lines: rate limiting on
# Cloudflare's own addresses is worse than none, because it throttles every
# visitor together. Use Cloudflare's dashboard rate limiting instead.

# --- the API ---------------------------------------------------------------
location / {
    proxy_pass http://127.0.0.1:18623;

    # No upstream keepalive: without an `upstream { keepalive }` block nginx
    # sends `Connection: close` and opens a connection per request, so
    # hotaru's 30 s limit, counted from accept, covers one request at a time.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Two zones per visitor (IPv6: per /64), defined in `http {}` above.
    # hcrpoll takes GET and OPTIONS at 30 r/s: a class of 30 behind one NAT
    # polling a round every 1.2 s is ~25 GET/s, and that is not doubled by
    # preflights only because hcr-server sends `Access-Control-Max-Age`.
    # hcrapi takes every other method at 4 r/s: submissions, lesson events and
    # the POST /score each servo Run or Test makes. A player testing and
    # resubmitting is bursty by nature, and `nodelay` serves a burst of 60
    # immediately rather than queueing it into a slow trickle.
    #
    # This is not what protects the CPU — `ReplayPool` bounds concurrent
    # replays and returns 429 when saturated. This stops the server being
    # *reached* that hard, which the service cannot do for itself: its only
    # notion of a caller is a header the client chooses.
    limit_req zone=hcrpoll burst=60 nodelay;
    limit_req zone=hcrapi burst=60 nodelay;
    limit_req_status 429;

    # Servo program IR is a few kB, but a Cutter Grid submission carries its
    # whole frozen trajectory — a few hundred kB typically, ~2.5m for a program
    # at the 500-command cap. 8m matches `MAX_REQUEST_BODY_BYTES` in
    # `deploy.rs`: the two must agree, because whichever is smaller is the real
    # limit, and if that one is nginx the client gets a bare 413 with no
    # `HcrError` body and nothing in the service log to explain it.
    #
    # Still far below the stock aaPanel 50m, which is 50m of attacker-controlled
    # body the server would buffer for no reason.
    client_max_body_size 8m;

    # Replay is bounded by the pool's own tick budget; this is only a backstop
    # against a hung upstream.
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
}

# --- do NOT add CORS headers here ------------------------------------------
#
# hcr-server emits them itself, including the 204 for the OPTIONS preflight
# (`hotaru_binding::handle`), driven by HCR_CORS_ORIGIN. Adding
# `add_header Access-Control-Allow-Origin` in nginx as well produces the header
# *twice*, and a browser rejects a duplicated CORS header outright — so the
# well-meant fix is what breaks it. If preflight fails, check HCR_CORS_ORIGIN.

# --- security headers ------------------------------------------------------
# `always` so they are present on error responses too, which is where nginx
# otherwise drops them.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
server_tokens off;
